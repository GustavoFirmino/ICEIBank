#
# Configuracao COMPARTILHADA entre as 3 agencias. So server.port e agencia.id
# ficam nos arquivos application-agenciaN.yml - tudo o mais (segredo JWT,
# usuarios de demonstracao, chave interna entre agencias) precisa ser IDENTICO
# nas 3 instancias, senao um token emitido pela agencia 0 nao valida na agencia 1.

agencia:
  total-agencias: 3
  porta-base: 4047 # 4000 + OFFSET (47)

jwt:
  secret: "iceibank-segredo-jwt-sprint1-troque-em-producao-47-abcdef0123456789"
  expiration-seconds: 300
  debug-endpoints-enabled: true

app:
  usuarios:
    - username: gustavo
      password: senha123
    - username: aluno
      password: senha123

cors:
  allowed-origin: "http://localhost:5173"

server:
  error:
    include-message: always

# --- Sprint 2: RabbitMQ (mensageria) ----------------------------------------
# A URL AMQP vem da variavel de ambiente RABBITMQ_URL (CloudAMQP:
# amqps://usuario:senha@host.cloudamqp.com/vhost). Sem a variavel, usa o
# RabbitMQ local do Docker (.\iniciar-rabbitmq.ps1). Igual nas 3 agencias.
spring:
  rabbitmq:
    uri: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672/}
    # confirmacao do broker: "publicada" so vale depois que o RabbitMQ aceitou a mensagem
    publisher-confirm-type: correlated
    # broker inalcancavel nao pode prender a thread HTTP por 60 s (padrao): falha rapido e estorna
    connection-timeout: 5s
    listener:
      simple:
        # mensagem rejeitada NAO volta para a fila (evita loop infinito) - vai para a dead-letter queue
        default-requeue-rejected: false
        missing-queues-fatal: false

